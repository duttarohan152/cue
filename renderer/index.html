<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <title>cue</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Dedicated drag handle / top bar -->
    <div id="toolbar" class="drag-handle">
      <div class="drag-pill" data-tip="Drag to move window">
        <span class="drag-dots" aria-hidden="true"></span>
        <span class="drag-label">Drag</span>
      </div>
      <button class="tb-logo" id="logo-btn" data-tip="cue"></button>
      <div class="tb-divider"></div>
      <button class="tb-hide" id="hide-btn"><span class="chev"></span><span>Hide</span></button>
      <div class="tb-divider"></div>
      <button class="tb-stop" id="stop-btn" data-tip="Start / stop listening"></button>
    </div>

    <!-- Main assistant panel -->
    <div id="panel-wrap">
      <span id="live-dot" class="off"></span>
      <div id="stt-status" class="stt-status stt-disconnected" data-tip="STT connection status">off</div>
      <div id="panel" class="glass no-drag">
        <div id="messages"></div>

        <div id="transcript-wrap" class="transcript-wrap hidden">
          <div id="transcript-list" class="transcript-list"></div>
        </div>

        <div id="action-row">
          <button class="act act-primary" data-mode="say"
            data-tip="Suggests what to say next based on the conversation">
            <span class="ic"></span><span>What to say</span>
          </button>
          <span class="sep">•</span>
          <button class="act act-secondary" data-mode="assist"
            data-tip="Scans your screen and conversation to decide what you need">
            <span class="ic"></span><span>Assist</span>
          </button>
          <span class="sep">•</span>
          <button class="act" data-mode="leetcode" data-tip="Solves the coding problem shown on screen"><span class="ic"></span><span>Solve</span></button>
          <span class="sep">•</span>
          <button class="act" id="transcript-toggle-btn" data-tip="Show/hide what was heard"><span class="ic"></span><span>Transcript</span></button>
          <span class="sep">•</span>
          <button class="act act-clear" id="clear-transcript-btn" data-tip="Clear transcript and start fresh"><span class="ic"></span><span>Clear</span></button>
        </div>

        <div id="composer">
          <div id="input-area">
            <div id="placeholder">Ask about your screen or conversation, or <span class="keycap">⌘</span><span class="keycap">⏎</span> for Assist</div>
            <textarea id="input" rows="1" spellcheck="false"></textarea>
          </div>
          <div id="composer-bottom">
            <button id="smart-toggle" class="smart-pill"><span class="ic"></span><span>Smart</span></button>
            <div id="lang-dd" class="lang-dd" data-tip="Language for coding answers (Auto infers from the problem)">
              <button id="lang-dd-btn" class="lang-dd-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
                <span id="lang-dd-label">C++</span>
                <span class="lang-dd-caret" aria-hidden="true">▾</span>
              </button>
              <div id="lang-dd-menu" class="lang-dd-menu hidden" role="listbox">
                <button type="button" class="lang-dd-opt" data-value="auto" role="option">Auto</button>
                <button type="button" class="lang-dd-opt" data-value="c" role="option">C</button>
                <button type="button" class="lang-dd-opt" data-value="cpp" role="option">C++</button>
                <button type="button" class="lang-dd-opt" data-value="python" role="option">Python</button>
                <button type="button" class="lang-dd-opt" data-value="bash" role="option">Bash</button>
              </div>
            </div>
            <button id="more-btn" class="more-btn" data-tip="Settings"></button>
            <div class="spacer"></div>
            <button id="send-btn" data-tip="Send"></button>
          </div>
        </div>

        <div id="prep-status" class="prep-status">
          <span class="prep-item" data-field="resume">📄 Resume</span>
          <span class="prep-item" data-field="jd">💼 JD</span>
          <span class="prep-item" data-field="stories">🎯 Stories</span>
          <span class="prep-item" data-field="salary">💰 Salary</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings -->
  <div id="settings-scrim" class="hidden">
    <div id="settings" class="glass">
      <div class="s-head">
        <div class="s-title">Settings</div>
        <button id="s-close" class="s-close">Done</button>
      </div>

      <!-- Tab bar -->
      <div class="s-tabs">
        <button class="s-tab on" data-tab="keys">🔑 Keys</button>
        <button class="s-tab" data-tab="profile">📄 Profile</button>
        <button class="s-tab" data-tab="prep">🎯 Interview Prep</button>
        <button class="s-tab" data-tab="qa">💬 Q&amp;A</button>
      </div>

      <!-- Tab: Keys -->
      <div class="s-body s-tab-pane" data-pane="keys">
        <label class="s-label">Provider</label>
        <div class="s-seg" id="provider-seg">
          <button data-provider="openai">OpenAI</button>
          <button data-provider="anthropic">Anthropic</button>
          <button data-provider="gemini">Gemini</button>
          <button data-provider="bedrock">Bedrock</button>
        </div>

        <div id="api-keys-group" style="display: contents;">
          <label class="s-label">API keys <span class="s-hint">stored locally · never sent to any server</span></label>
          <div class="s-field"><span>OpenAI</span><input id="key-openai" type="password" placeholder="sk-..." autocomplete="off" /></div>
          <div class="s-field"><span>Anthropic</span><input id="key-anthropic" type="password" placeholder="sk-ant-..." autocomplete="off" /></div>
          <div class="s-field"><span>Gemini</span><input id="key-gemini" type="password" placeholder="AIza..." autocomplete="off" /></div>
        </div>

        <div id="bedrock-group" style="display: contents;">
          <label class="s-label">Amazon Bedrock <span class="s-hint">AWS credentials for Claude via Bedrock · stored locally</span></label>
          <div class="s-field"><span>Access Key</span><input id="bedrock-access-key" type="password" placeholder="AKIA..." autocomplete="off" /></div>
          <div class="s-field"><span>Secret Key</span><input id="bedrock-secret-key" type="password" placeholder="AWS secret access key" autocomplete="off" /></div>
          <div class="s-field"><span>Region</span><input id="bedrock-region" type="text" placeholder="us-east-1" autocomplete="off" /></div>
          <div class="s-field"><span>Session</span><input id="bedrock-session-token" type="password" placeholder="optional — temporary credentials only" autocomplete="off" /></div>
        </div>

        <label class="s-label">Transcription <span class="s-hint">Deepgram key for speech-to-text · works with any provider</span></label>
        <div class="s-field"><span>Deepgram</span><input id="key-deepgram" type="password" placeholder="dg-..." autocomplete="off" /></div>

        <label class="s-label">Models <span class="s-hint">fast = Smart off · smart = Smart on</span></label>
        <div class="s-field"><span>Fast</span><input id="model-fast" type="text" autocomplete="off" /></div>
        <div class="s-field"><span>Smart</span><input id="model-smart" type="text" autocomplete="off" /></div>

        <label class="s-label">Assistant access <span class="s-hint">programs allowed to see what cue is doing</span></label>
        <div class="s-callers" id="applink-callers"></div>

        <div class="s-status" id="s-status"></div>
      </div>

      <!-- Tab: Profile -->
      <div class="s-body s-tab-pane hidden" data-pane="profile">
        <label class="s-label">Your resume <span class="s-hint">paste full resume — cue parses it into sections</span></label>
        <textarea id="resume-text" rows="7" spellcheck="false" placeholder="Paste your full resume here. cue will extract Name, Summary, Experience, Skills, Projects, and Education automatically."></textarea>

        <label class="s-label">Target job description <span class="s-hint">optional — every answer gets tailored to this role</span></label>
        <textarea id="job-description" rows="5" spellcheck="false" placeholder="Paste the job description for the role you're interviewing for. cue will highlight your most relevant experience."></textarea>
      </div>

      <!-- Tab: Interview Prep -->
      <div class="s-body s-tab-pane hidden" data-pane="prep">
        <label class="s-label">Your STAR stories <span class="s-hint">write 3–5 real behavioral stories — used for "tell me about a time…" questions</span></label>
        <textarea id="star-stories" rows="8" spellcheck="false" placeholder="Story 1: At [Company], we faced [situation]. I was responsible for [task]. I did [specific actions]. The result was [outcome with metrics if possible].&#10;&#10;Story 2: ..."></textarea>

        <label class="s-label">Why this company <span class="s-hint">used for motivation questions</span></label>
        <textarea id="why-company" rows="3" spellcheck="false" placeholder="e.g. I admire how [company] has [specific thing]. Their work on [X] aligns with my experience in [Y]..."></textarea>

        <label class="s-label">Why leaving current role <span class="s-hint">keep it positive</span></label>
        <textarea id="why-leaving" rows="2" spellcheck="false" placeholder="e.g. I've grown a lot at [company] and I'm looking for [next challenge]..."></textarea>

        <label class="s-label">Work style &amp; values <span class="s-hint">used for culture fit and situational questions</span></label>
        <textarea id="work-style" rows="3" spellcheck="false" placeholder="e.g. I prefer data-driven decisions, work well with autonomy, value direct feedback, thrive in fast-paced environments..."></textarea>
      </div>

      <!-- Tab: Q&A -->
      <div class="s-body s-tab-pane hidden" data-pane="qa">
        <label class="s-label">Salary target <span class="s-hint">used when asked about compensation</span></label>
        <input id="salary-target" type="text" placeholder="e.g. $150k–$180k base + equity, open to discuss total comp" autocomplete="off" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.14);background:rgba(0,0,0,0.25);color:#fff;font-size:13px;font-family:inherit;outline:none;" />

        <label class="s-label" style="margin-top:14px;">Questions to ask the interviewer <span class="s-hint">cue will suggest these at the end</span></label>
        <textarea id="questions-to-ask" rows="6" spellcheck="false" placeholder="e.g.&#10;- What does success look like in the first 90 days?&#10;- How does the team handle technical debt?&#10;- What's the biggest challenge the team is facing right now?&#10;- How does feedback and mentorship work here?"></textarea>
      </div>

    </div>
  </div>

  <!-- First-run tutorial / walkthrough -->
  <div id="onboard-scrim" class="hidden">
    <div id="onboard" class="glass">
      <div class="ob-dots" id="ob-dots"></div>
      <div class="ob-icon" id="ob-icon"></div>
      <div class="ob-title" id="ob-title"></div>
      <div class="ob-body" id="ob-body"></div>
      <div class="ob-buttons" id="ob-buttons"></div>
      <div class="ob-actions">
        <button id="ob-skip" class="ob-ghost">Skip</button>
        <div class="spacer"></div>
        <button id="ob-back" class="ob-ghost">Back</button>
        <button id="ob-next" class="ob-primary">Next</button>
      </div>
    </div>
  </div>

  <!-- Assistant access request. Shown in-window rather than as a native dialog:
       cue hides its dock icon, so an OS panel never comes forward and cannot be
       clicked. -->
  <div id="consent-scrim" class="hidden">
    <div id="consent" class="glass">
      <div class="cs-title" id="cs-title"></div>
      <div class="cs-body" id="cs-body"></div>
      <div class="cs-actions">
        <button id="cs-deny" class="ob-ghost">Don’t allow</button>
        <button id="cs-allow" class="ob-primary">Allow</button>
      </div>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
